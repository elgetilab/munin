<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Munin</title>
    <link rel="stylesheet" href="/shared/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 120px auto;
            padding: 0 24px;
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
        }

        .auth-logo {
            height: 48px;
            width: auto;
            filter: brightness(0) invert(1);
            margin-bottom: 24px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-form input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            text-align: center;
        }

        .auth-form button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }

        .auth-error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--error);
            border-radius: 8px;
            padding: 12px;
            color: var(--error);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .auth-footer {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <img src="/shared/munin_logo_without_script.webp" alt="Munin" class="auth-logo">
            <h1 class="auth-title">Sign in to Munin</h1>
            <p class="auth-subtitle">Enter your email to receive a login code.</p>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="POST" action="/login">
                <input type="hidden" name="redirect" value="{{ redirect }}">
                <input type="email" name="email" placeholder="you@example.com" required autofocus>
                <button type="submit" class="btn btn-primary">Send code</button>
            </form>

            <div class="auth-footer">
                <a href="{{ site_url or '/' }}">&larr; Back to Munin</a>
            </div>
        </div>
    </div>
</body>
</html>
