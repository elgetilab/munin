# Grafana provisioning: datasources.
#
# Loaded on container startup from
# /etc/grafana/provisioning/datasources/. Sets Prometheus as the
# default datasource so the provisioned dashboard (see
# /etc/grafana/provisioning/dashboards/) can resolve its queries
# without manual setup.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
