[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labkit"
version = "0.3.0"
description = "Vetted helpers for lab data analysis in the Munin sandbox: Prism-style curve fitting, instrument readers, NMR, EPR and statistics"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# Everything it uses is already in the sandbox image (backend/sandbox/requirements.txt);
# installed with --no-deps so it never changes those pins.
dependencies = ["numpy", "scipy", "pandas"]

[tool.setuptools]
packages = ["labkit"]

# Shipped with the package so bundles that carry labkit carry its license.
[tool.setuptools.package-data]
labkit = ["LICENSE", "THIRD_PARTY_NOTICES"]
