# ==============================================================================
# MUNIN SERVICES - Docker Compose
# ==============================================================================
# Always-on services for the Munin research cluster.
# vLLM is started separately by SLURM job.
#
# ------------------------------------------------------------------------------
# THIS FILE SERVES TWO TARGETS. Read this before editing a path.
# ------------------------------------------------------------------------------
# 1. The reference cluster. `deploy.sh compose` installs this file into
#    /opt/munin/docker/ and runs `docker compose` from there. Every default
#    below IS the production value, so the cluster needs no overrides at all
#    and an operator running `docker compose` by hand in /opt/munin/docker
#    gets exactly the deployed behaviour. (Same principle as the encoder
#    defaults: see DECISIONS.md 2026-08, "deploy defaults are production".)
#
# 2. A single-host run straight from a clone, for development, demos, and
#    anyone reproducing the system. The repo-root `.env.example` overrides the
#    path variables to point back into the working tree. See
#    docs/SINGLE-HOST-PLAN.md.
#
# The two never collide because Compose reads `.env` from the CURRENT WORKING
# DIRECTORY: the cluster picks up /opt/munin/docker/.env (a symlink to
# cluster.env), a local run picks up the repo-root .env.
#
# GOTCHA when overriding a path with a RELATIVE value: Compose resolves it
# against the PROJECT DIRECTORY, which is this file's directory
# (backend/docker/), not your shell's cwd. So repo root is `../..` from here.
# The repo-root .env.example already accounts for this; copy its style.
#
# Path variables, all defaulting to the production layout:
#   MUNIN_ROOT            /opt/munin                     data, models, knowledge
#   MUNIN_RETRIEVAL_SRC   /opt/munin/services/retrieval  retrieval build context
#   MUNIN_SANDBOX_SRC     /opt/munin/services/sandbox    sandbox build context
#   MUNIN_PIPELINE_SRC    /opt/cluster/scripts/pipeline  pipeline mounted into retrieval
#   MUNIN_PERSONAS_SRC    /opt/munin/personas            persona JSON + logos
#   MUNIN_AGENT_CONFIG    /opt/munin/config              agents.yml, faq.yml
#   MUNIN_SEARXNG_CONFIG  /opt/munin/services/searxng    searxng settings.yml
#   MUNIN_DOCKER_CONFIG   /opt/munin/docker              grobid.yaml, prometheus.yml
#
# Resource variables, sized for a cluster node by default and worth lowering
# on a laptop (GROBID in particular will thrash a 16 GB machine):
#   GROBID_IMAGE          lfoppiano/grobid:0.8.2   (already the SMALL one:
#                                                   1.73 GB, vs 9.53 GB for the
#                                                   official grobid/grobid)
#   GROBID_JAVA_OPTS      -Xmx12g -Xms2g
#   GROBID_MEM_LIMIT      16G
#
# ------------------------------------------------------------------------------
# ONE-TIME MIGRATION on the reference cluster (read before the next deploy)
# ------------------------------------------------------------------------------
# The `name:` below pins the Compose PROJECT. Without it, Compose derives the
# project from the directory basename, which is `docker` both for
# /opt/munin/docker and for this file's own backend/docker. Two different
# checkouts therefore looked like ONE stack: running `docker compose up` from a
# clone on a host already running Munin silently recreated the live containers
# against the clone's (empty) data directories, and a `down` tore the whole
# production stack out. That is not hypothetical; it happened on 2026-08-14.
#
# Pinning the name fixes it, but the stack deployed before this change carries
# `com.docker.compose.project=docker`, so the first deploy after it will hit
# container-name conflicts. Migrate once, during a maintenance window:
#
#     sudo ./deploy.sh compose      # 1. install THIS file (pins the name)
#     cd /opt/munin/docker
#     # 2. tear down the OLD project. `-p docker` is required once this file is
#     #    installed, and the profile flags are required or retrieval, sandbox
#     #    and prometheus are left running under the old project.
#     sudo docker compose -p docker --profile rag --profile monitoring down
#     sudo docker compose --profile rag --profile monitoring up -d   # 3.
#
# All application data is in bind mounts, so nothing there is lost. The ONE
# casualty is Prometheus: its TSDB lives in a named volume, which Compose scopes
# by project, so `docker_prometheus_data` is orphaned and the admin Metrics tab
# restarts with an empty 30-day window. The old volume is not deleted; recover
# the history later by copying it into `munin_prometheus_data` if it matters.
# `deploy.sh` detects the project mismatch and refuses to run rather than
# failing halfway.
# ==============================================================================

# Pin the project name. See the migration note above before changing it.
name: ${MUNIN_PREFIX:-munin}

services:
  # ============================================================================
  # QDRANT - Vector database for paper embeddings
  # ============================================================================
  qdrant:
    # Pinned to the version the reference deployment runs (2026-10-04).
    image: qdrant/qdrant:v1.16.3
    container_name: ${MUNIN_PREFIX:-munin}-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - ${MUNIN_ROOT:-/opt/munin}/knowledge/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # ============================================================================
  # NEO4J - Graph database for citations and author networks
  # ============================================================================
  neo4j:
    # Pinned to the version the reference deployment runs (2026-10-04).
    image: neo4j:5.26.19-community
    container_name: ${MUNIN_PREFIX:-munin}-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - ${MUNIN_ROOT:-/opt/munin}/knowledge/neo4j_data:/data
      - ${MUNIN_ROOT:-/opt/munin}/knowledge/neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set (any value; it is the graph DB password)}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G

  # ============================================================================
  # GROBID - Scientific PDF parsing
  # ============================================================================
  grobid:
    # 0.8.2 ships with improved Crossref throttling (response to
    # 2026-Q2 abuse reports). Pair it with the mounted grobid.yaml
    # below so our consolidator hits Crossref's polite pool via
    # mailto. See docker/grobid/grobid.yaml.
    image: ${GROBID_IMAGE:-lfoppiano/grobid:0.8.2}
    container_name: ${MUNIN_PREFIX:-munin}-grobid
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GROBID_HOST_PORT:-8070}:8070"
    volumes:
      # Override the in-image grobid.yaml so we can set
      # consolidation.crossref.mailto = admin@example.org. Without
      # this, GROBID's internal "Grobi/x.y" Crossref client uses
      # the anonymous pool and gets rate-limited.
      - ${MUNIN_DOCKER_CONFIG:-/opt/munin/docker}/grobid/grobid.yaml:/opt/grobid/grobid-home/config/grobid.yaml:ro
    environment:
      # GROBID's JVM defaults to ~4 GB heap — too small once the
      # watcher daemon + admin-ingest + cron retry all hammer it
      # concurrently with --workers 4. We saw an OOM in the
      # AsyncAppender thread that wedged request handlers without
      # killing the container (so HTTP timed out instead of
      # refusing). 12 GB heap leaves 4 GB for off-heap (model
      # files, native LSTM/CRF buffers, OS cache) inside the 16 GB
      # cap below.
      #
      # Set BOTH JAVA_OPTS (used by some launch wrappers) and
      # JAVA_TOOL_OPTIONS (always honored by the JVM regardless of
      # wrapper). Belt + suspenders so the heap actually grows.
      # Restart GROBID with `up -d --force-recreate` after editing.
      - JAVA_OPTS=${GROBID_JAVA_OPTS:--Xmx12g -Xms2g}
      - JAVA_TOOL_OPTIONS=${GROBID_JAVA_OPTS:--Xmx12g -Xms2g}
    deploy:
      resources:
        limits:
          memory: ${GROBID_MEM_LIMIT:-16G}

  # ============================================================================
  # SEARXNG - Self-hosted meta-search engine (free web search)
  # ============================================================================
  searxng:
    # Pinned to the version the reference deployment runs (2026-10-04).
    image: searxng/searxng:2026.1.2-3d88876a3
    container_name: ${MUNIN_PREFIX:-munin}-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_HOST_PORT:-8888}:8080"
    volumes:
      - ${MUNIN_SEARXNG_CONFIG:-/opt/munin/services/searxng}:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set (openssl rand -hex 32)}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # ============================================================================
  # RETRIEVAL SERVICE - RAG API for multiple knowledge bases
  # ============================================================================
  retrieval:
    build:
      context: ${MUNIN_RETRIEVAL_SRC:-/opt/munin/services/retrieval}
      dockerfile: Dockerfile
    image: ${MUNIN_PREFIX:-munin}-retrieval:latest
    container_name: ${MUNIN_PREFIX:-munin}-retrieval
    restart: unless-stopped
    ports:
      # Loopback only, unless a split install reaches retrieval over a VPN or
      # private network: then the VPN address. Never 0.0.0.0, never a network
      # other people are on (retrieval trusts the gateway's identity headers).
      - "${RETRIEVAL_BIND_ADDR:-127.0.0.1}:${RETRIEVAL_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allows container to reach host services
    volumes:
      - ${MUNIN_ROOT:-/opt/munin}/data/models/bge-base:/models/bge-base:ro
      - ${MUNIN_ROOT:-/opt/munin}/data/models/specter:/models/specter:ro
      # BGE-large paper encoder (encoder migration). Empty/missing is fine until
      # PAPER_ENCODER=bge-large is set. See docs/paper-track/done/ENCODER-MIGRATION-PLAN.md.
      - ${MUNIN_ROOT:-/opt/munin}/data/models/bge-large:/models/bge-large:ro
      # Hugging Face cache: when no weights were staged under data/models,
      # the encoders download once into here instead of on every recreate.
      - ${HF_CACHE_DIR:-${MUNIN_ROOT:-/opt/munin}/data/hf-cache}:/root/.cache/huggingface
      # The served backbone's tokenizer for exact context-budget token
      # counting (P1 #8). Only the tokenizer files, staged out of the vLLM
      # model dir by `deploy.sh model activate` (into qwen-tokenizer/, the
      # historical name kept so nothing else moves); the container never
      # needs the weights. Empty/missing dir is fine: chat_context falls back
      # to a char heuristic. See DECISIONS.md 2026-05-21. A secondary instance
      # overrides TOKENIZER_HOST_DIR to its own staged copy.
      - ${TOKENIZER_HOST_DIR:-${MUNIN_ROOT:-/opt/munin}/data/models/qwen-tokenizer}:/models/qwen:ro
      # :rw because /api/admin/ingest writes PDFs into pdf/inbox/ and
      # moves them to pdf/{doi_hash}.pdf after the pipeline succeeds (§28).
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/pdf:/papers:rw
      # Processed-marker dir the pipeline watcher consults (one
      # JSON per PDF basename). /api/admin/ingest writes a marker
      # on success so the watcher daemon skips papers the
      # admin-ingest path already handled.
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/processed:/papers-processed:rw
      # Persona definitions (chat personas + logos)
      - ${MUNIN_PERSONAS_SRC:-/opt/munin/personas}:/app/personas:ro
      # Agent registry (agents.yml)
      - ${MUNIN_AGENT_CONFIG:-/opt/munin/config}:/app/config:ro
      # Chat persistence (SQLite) and user document store
      - ${MUNIN_ROOT:-/opt/munin}/data:/data:rw
      - ${MUNIN_ROOT:-/opt/munin}/data/user_docs:/data/user_docs:rw
      # Deep Research volumes
      - ${MUNIN_ROOT:-/opt/munin}/deepresearch/queue:/deepresearch/queue:rw
      - ${MUNIN_ROOT:-/opt/munin}/deepresearch/jobs:/deepresearch/jobs:ro
      - ${MUNIN_ROOT:-/opt/munin}/deepresearch:/deepresearch/status:ro
      # §15 embedding map (built by host-side systemd timer)
      - ${MUNIN_ROOT:-/opt/munin}/knowledge:/knowledge:ro
      # §28 paper pipeline (invoked as subprocess by /api/admin/ingest)
      - ${MUNIN_PIPELINE_SRC:-/opt/cluster/scripts/pipeline}:/app/pipeline:ro
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      - SEARXNG_URL=http://searxng:8080
      - SPECTER_MODEL_PATH=/models/specter
      - BGE_MODEL_PATH=/models/bge-base
      # Paper encoder. The defaults ARE production (cutover completed
      # 2026-07), so a host without these keys in cluster.env still comes up
      # on the live stack. Rollback = set both to specter / papers.
      # They move together or retrieval refuses to boot (dim mismatch guard
      # in database.verify_paper_space). See ENCODER-MIGRATION-PLAN.md.
      - PAPER_ENCODER=${PAPER_ENCODER:-bge-large}
      - PAPERS_COLLECTION=${PAPERS_COLLECTION:-papers_bge}
      - BGE_LARGE_MODEL_PATH=${BGE_LARGE_MODEL_PATH:-/models/bge-large}
      - QWEN_TOKENIZER_PATH=/models/qwen/tokenizer.json
      - PAPERS_PDF_DIR=/papers
      # Chat persistence + user docs
      - CHATS_DB_PATH=/data/chats.db
      - USER_DOCS_DIR=/data/user_docs
      # LEGACY Deep Research (MiroThinker + deepresearch-daemon + SLURM job).
      # Disabled 2026-07, kept so past reports stay downloadable; see
      # DECISIONS.md. DEEPRESEARCH_ENABLED=1 in cluster.env re-opens
      # POST /deepresearch/submit, and needs the daemon enabled too.
      # This is NOT the Deep Research users see in chat, which runs
      # in-process in retrieval (see DEEP_RESEARCH_* below).
      - DEEPRESEARCH_ENABLED=${DEEPRESEARCH_ENABLED:-0}
      - DEEPRESEARCH_QUEUE_DIR=/deepresearch/queue
      - DEEPRESEARCH_JOBS_DIR=/deepresearch/jobs
      - SLURM_QUEUE_FILE=/deepresearch/status/slurm_queue.json
      # CURRENT Deep Research: the in-process agent behind /api/research/*.
      # Checkpoints land in /data/deep_research (host
      # /opt/munin/data/deep_research). MAX_CONCURRENT bounds how many
      # research jobs share vLLM with interactive chat.
      - DEEP_RESEARCH_DIR=${DEEP_RESEARCH_DIR:-/data/deep_research}
      - DEEP_RESEARCH_MAX_CONCURRENT=${DEEP_RESEARCH_MAX_CONCURRENT:-1}
      # Where this instance lives. REQUIRED: there is deliberately no
      # fallback domain, since a wrong one breaks login and paper links in
      # ways that are hard to see. Every URL below derives from it unless set
      # explicitly. MUNIN_CLUSTER_NAME is how the system prompt names the
      # cluster; MUNIN_CONTACT_EMAIL is the mailto Crossref, NCBI and
      # Unpaywall ask for (left out when empty, never invented).
      - MUNIN_DOMAIN=${MUNIN_DOMAIN:?MUNIN_DOMAIN must be set, e.g. MUNIN_DOMAIN=lab.example.edu (see .env.example)}
      - MUNIN_CLUSTER_NAME=${MUNIN_CLUSTER_NAME:-}
      - MUNIN_CONTACT_EMAIL=${MUNIN_CONTACT_EMAIL:-}
      # Shared secret with the frontend. When set, a request carrying a
      # forwarded identity header (X-Munin-Email, ...) must also carry this
      # token, so a retrieval port reachable by others is not an
      # impersonation hole. Empty: identity headers are trusted as before.
      - MUNIN_GATEWAY_TOKEN=${MUNIN_GATEWAY_TOKEN:-}
      # Base URL used when a report links back to a Munin page.
      - MUNIN_PUBLIC_URL=${MUNIN_PUBLIC_URL:-https://search.${MUNIN_DOMAIN}}
      # vLLM for MCP tools (llm_summarize, web_fetch with summarize)
      # Uses host.docker.internal to reach vLLM running on host
      # (resolved via the extra_hosts host-gateway entry above; must not be
      # pinned to a host LAN IP — that breaks on any subnet change)
      # LLM_BASE_URL / LLM_MODEL_NAME (the documented names) win over the
      # VLLM_* aliases the cluster sets. They used to reach no container at
      # all, so a single-host .env pointing at Ollama was silently ignored.
      - VLLM_URL=${LLM_BASE_URL:-${VLLM_URL:-http://host.docker.internal:8000}}
      # Backbone identity and behaviour. Sourced from the model profile
      # (/opt/munin/config/active-model.env, written by `deploy.sh model
      # activate <slug>` from config/models/<slug>.env) and exported by the
      # vLLM start scripts and deploy.sh before `docker compose up`, the same
      # way the window variables below travel. Until 2026-09-15 the model
      # name was a literal here and the thinking/effort knobs were not passed
      # at all, so the container could only ever run its Python defaults.
      # Defaults = the Qwen3.8 reference deployment.
      - VLLM_MODEL_NAME=${LLM_MODEL_NAME:-${VLLM_MODEL_NAME:-qwen3.8-27b}}
      - LLM_THINKING_TOGGLE=${LLM_THINKING_TOGGLE:-1}
      - LLM_THINKING_MODE=${LLM_THINKING_MODE:-enable_thinking}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-medium}
      # Sampling profile per persona class (JSON objects; blank = Qwen3 set).
      - SAMPLING_DEFAULT=${SAMPLING_DEFAULT:-}
      - SAMPLING_CODE=${SAMPLING_CODE:-}
      # Context window: the vLLM start scripts `export` these before
      # `docker compose up` to match the running mode (single-GPU 65536/60000,
      # TP=2 131072/125000) so the backend uses the right window. Compose
      # substitutes the invoking shell's env here; defaults = single-GPU.
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-65536}
      - VLLM_MAX_CONTEXT=${VLLM_MAX_CONTEXT:-60000}
      # A3: up-front per-turn router. See munin.env.
      - ROUTER_ENABLED=${ROUTER_ENABLED:-true}
      # Semantic Scholar API (for semantic_scholar_search tool)
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      # Brave Search API (primary web_search source; SearXNG scrapers are
      # dead from the datacenter IP). QPS default matches the free tier;
      # raise in cluster.env if the key's paid tier allows (Base = 20/s).
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - BRAVE_SEARCH_QPS=${BRAVE_SEARCH_QPS:-1}
      - BRAVE_MAX_QUERIES=${BRAVE_MAX_QUERIES:-3}
      # Sandbox sidecar (§2). Reached over the internal sandbox-net.
      - SANDBOX_URL=http://sandbox:8090
      # §28 contributor ingest (VPS hook → POST /api/admin/ingest)
      - ADMIN_INGEST_TOKEN=${ADMIN_INGEST_TOKEN:-}
      # P1 #11: contributors.yml is now pulled from auth.<MUNIN_DOMAIN>
      # on a 5-minute timer. CONTRIBUTORS_CONFIG points at the writable
      # /data mount because /app/config is read-only. The deploy script
      # seeds /opt/munin/data/contributors.yml (= /data inside) the
      # first time so ingest works before the first sync completes.
      - CONTRIBUTORS_CONFIG=/data/contributors.yml
      - CONTRIBUTORS_SYNC_URL=${CONTRIBUTORS_SYNC_URL-https://auth.${MUNIN_DOMAIN}/admin/contributors.yaml}
      - CONTRIBUTORS_SYNC_TOKEN=${CONTRIBUTORS_SYNC_TOKEN:-}
      # Admin metrics proxy (in-house dashboards under webui Admin
      # panel -> Metrics tab). URL points at the auth service's
      # /admin/check-role endpoint; the token is the same KB_GATE_TOKEN
      # the tusd hook-service uses, since the lookup is identical
      # (read-only role check). When the token is unset, the metrics
      # proxy returns 503 so the panel surfaces "not configured".
      - AUTH_CHECK_ROLE_URL=${AUTH_CHECK_ROLE_URL-https://auth.${MUNIN_DOMAIN}/admin/check-role}
      - KB_GATE_TOKEN=${KB_GATE_TOKEN:-}
      # Prometheus URL for the metrics proxy. Inside the docker network
      # the prometheus container is reachable by service name.
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - CONTRIBUTORS_SYNC_INTERVAL_SECS=${CONTRIBUTORS_SYNC_INTERVAL_SECS:-300}
      - PAPER_PIPELINE_SCRIPT=/app/pipeline/paper_pipeline.py
      # paper_pipeline.py subprocess reads this for GROBID connectivity
      # (QDRANT_HOST / NEO4J_PASSWORD are already set above and inherited).
      - GROBID_URL=http://grobid:8070
      # /api/admin/ingest writes a processed-marker here so the
      # host-side munin-paper-pipeline.service watcher skips the paper.
      # Since 2026-08-18 the paper_pipeline subprocess reads this and
      # PAPERS_PDF_DIR too. It used to hardcode the host paths, which do not
      # exist in here, so it filed every uploaded PDF into the container's
      # writable layer and lost it on the next rebuild. Same failure mode as
      # MUNIN_REPORTED_DIR below. See UPLOAD-INGEST-REPAIR-PLAN.md defect 1.
      - PAPERS_PROCESSED_DIR=/papers-processed
      # OCR cache for scanned PDFs. Host path is /opt/munin/data/papers/
      # ocr_cache, which is this same directory via the /data mount.
      - PAPERS_OCR_CACHE_DIR=/data/papers/ocr_cache
      # POST /api/chats/{id}/report writes here. Default
      # /opt/munin/data/reported doesn't exist inside the container
      # (host's /opt/munin/data is mounted at /data), so without
      # this override reports land in the container's ephemeral
      # writable layer and vanish on rebuild. /data/reported is on
      # the persistent host volume.
      - MUNIN_REPORTED_DIR=/data/reported
      # Concurrency cap on /api/admin/ingest so the VPS hook + cron
      # can't fork 37+ paper_pipeline subprocesses in parallel and
      # saturate GROBID's 10-engine pool. Over-cap requests fast-fail
      # with 503 + Retry-After: 60. Keep below GROBID's pool size
      # (10) minus the watcher's --workers (1) → 4 leaves comfortable
      # headroom.
      - INGEST_CONCURRENCY=${INGEST_CONCURRENCY:-4}
      # ----------------------------------------------------------------
      # Knobs that used to have code defaults only (2026-08-04). Every
      # default below is the value the code already used, so passing them
      # changes nothing by itself; the point is that they can now be tuned
      # from cluster.env instead of needing a repo edit and a redeploy.
      # Catalogued in backend/docs/RUNTIME-CONFIG.md.
      # ----------------------------------------------------------------
      # Agent + tool behaviour
      - SOURCE_TRIAGE_ENABLED=${SOURCE_TRIAGE_ENABLED:-1}
      - CHAT_MAX_TOOL_CALLS=${CHAT_MAX_TOOL_CALLS:-30}
      - SANDBOX_HTTP_TIMEOUT_S=${SANDBOX_HTTP_TIMEOUT_S:-180}
      # Polite-pool identity for Unpaywall OA lookups.
      - UNPAYWALL_EMAIL=${UNPAYWALL_EMAIL:-${MUNIN_CONTACT_EMAIL:-}}
      # Personas. The two ids pick which profile a turn starts from; the
      # three paths must match the read-only mounts above, so change them
      # only alongside the corresponding volume.
      - DEFAULT_PERSONA=${DEFAULT_PERSONA:-chat}
      - AUTO_PERSONA=${AUTO_PERSONA:-munin}
      - PERSONAS_DIR=${PERSONAS_DIR:-/app/personas}
      - AGENTS_CONFIG=${AGENTS_CONFIG:-/app/config/agents.yml}
      - FAQ_PATH=${FAQ_PATH:-/app/config/faq.yml}
      # read_paper full-text cache. PAPERS_CACHE_WARN_GB only warns; there
      # is no eviction, and the cache stood at 2.0 GB on 2026-08-04.
      - PAPERS_CACHE_DIR=${PAPERS_CACHE_DIR:-/data/papers_cached}
      - PAPERS_CACHE_WARN_GB=${PAPERS_CACHE_WARN_GB:-5}
      # Agent trace + extraction records (both under the /data mount).
      - AGENT_TRACE_DIR=${AGENT_TRACE_DIR:-/data/agent_traces}
      - AGENT_EXTRACT_DIR=${AGENT_EXTRACT_DIR:-/data/agent_extracts}
      # Ingest timeouts (subprocess wall clock, and how long a request
      # waits for a slot before it 503s).
      - PIPELINE_TIMEOUT_SECS=${PIPELINE_TIMEOUT_SECS:-600}
      - INGEST_ACQUIRE_TIMEOUT_SECS=${INGEST_ACQUIRE_TIMEOUT_SECS:-5}
      - CONTRIBUTORS_SYNC_BACKOFF_SECS=${CONTRIBUTORS_SYNC_BACKOFF_SECS:-60}
      # Context-budget arithmetic. These interact with VLLM_MAX_MODEL_LEN /
      # VLLM_MAX_CONTEXT above: raising the output reserve shrinks the room
      # left for history. See chat_context.py before changing them.
      - VLLM_MAX_OUTPUT_TOKENS=${VLLM_MAX_OUTPUT_TOKENS:-16384}
      - VLLM_GENERATION_RESERVE=${VLLM_GENERATION_RESERVE:-16384}
      - VLLM_CTX_MARGIN=${VLLM_CTX_MARGIN:-512}
      - VLLM_MIN_OUTPUT_TOKENS=${VLLM_MIN_OUTPUT_TOKENS:-256}
      # 5, not 3: halving from VLLM_MAX_OUTPUT_TOKENS reaches only 2048 in three
      # steps, and production hit a wall of rejections still over the window at
      # 2048, so the ladder exhausted and the turn died. Keep in lockstep with
      # chat_context.MAX_REFIT_RETRIES - this value overrides that default.
      - VLLM_MAX_REFIT_RETRIES=${VLLM_MAX_REFIT_RETRIES:-5}
      # Log verbosity for the whole service.
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - qdrant
      - neo4j
      - searxng
      - sandbox
    networks:
      # Retrieval is on both the public-facing munin-network (where qdrant /
      # neo4j / searxng live) and the internal-only sandbox-net so it can
      # reach the sandbox container at http://sandbox:8090. The sandbox
      # itself is on sandbox-net only and cannot reach the internet or any
      # other Munin service.
      - default
      - sandbox-net
    profiles:
      - rag  # Start with: docker compose --profile rag up

  # ============================================================================
  # SANDBOX SERVICE - Jupyter kernels for run_python (§2)
  # ============================================================================
  sandbox:
    build:
      context: ${MUNIN_SANDBOX_SRC:-/opt/munin/services/sandbox}
      dockerfile: Dockerfile
    image: ${MUNIN_PREFIX:-munin}-sandbox:latest
    container_name: ${MUNIN_PREFIX:-munin}-sandbox
    restart: unless-stopped
    # No host port. Reachable only from the retrieval container over the
    # internal docker network at http://sandbox:8090.
    cap_add:
      # The service (root in the container) runs `unshare --net` to give each
      # kernel a loopback-only network namespace, which needs SYS_ADMIN. User
      # code never holds it: jail.py drops to an unprivileged uid with no
      # capabilities and no_new_privs before exec. Docker's default seccomp
      # and AppArmor profiles stay on; unshare works under both (checked
      # 2026-09-30). They were unconfined for firejail, which never sandboxed
      # anything inside the container.
      - SYS_ADMIN
    environment:
      - SANDBOX_SCRATCH_DIR=/scratch
      - SANDBOX_IDLE_TTL_S=900
      - SANDBOX_REAPER_INTERVAL_S=60
      - SANDBOX_MAX_TIMEOUT_S=120
    networks:
      - sandbox-net
    deploy:
      resources:
        limits:
          memory: 4G
          # MEASURED 2026-08-27: the sandbox previously had NO cpu limit at all
          # (NanoCpus=0, CpusetCpus="") and its processes were allowed cores
          # 0-23, i.e. the whole host. vLLM's SLURM cgroup pins it to a narrow
          # cpuset and it runs at 94-97% of that allocation under load, so an
          # unbounded run_python job could contend for the very cores inference
          # depends on and slow chat for every user. This bounds the blast
          # radius. It is a QUOTA, not a pinning: the sandbox may still land on
          # vLLM's cores, it just cannot consume more than 8 cores' worth. If
          # contention still shows up, add `cpuset` disjoint from vLLM's range.
          #
          # Overridable because the limit has to fit the host: Docker's daemon
          # rejects a container whose cpu quota exceeds the machine's core
          # count, so a 2-core CI runner cannot create this container at all
          # while the number is hard-coded at 8 (it broke the weekly
          # single-host smoke from 2026-09-07 on). Unset means 8, so the
          # cluster keeps the measured production value.
          cpus: '${SANDBOX_CPUS:-8}'
          # Bounds a fork bomb from user code across all kernels. Here and
          # not as `pids_limit:`, which compose rejects next to a
          # deploy.resources.limits block.
          pids: 2048
    profiles:
      - rag

  # ============================================================================
  # vLLM (profile: gpu) - OPTIONAL, and off by default
  # ============================================================================
  # Munin needs an OpenAI-compatible /v1 endpoint; it does not care what serves
  # it. The default is to bring your own via LLM_BASE_URL (Ollama, llama.cpp, a
  # remote vLLM, a hosted API). This service is here for the case where the
  # host has an NVIDIA GPU and you want the reference server locally.
  #
  # NOT in the default profile set, and it must not be: it fails to start on
  # any machine without an NVIDIA runtime, which is most machines.
  #
  # The reference deployment does NOT use this. There vLLM runs as a SLURM job
  # with the GPU allocated by the scheduler (scripts/vllm/start-vllm-service.sh),
  # because the cluster shares its GPUs with other work. The flags below mirror
  # that script; keep them in step if you change one.
  #
  # Set LLM_BASE_URL=http://vllm:8000 to point retrieval at it.
  vllm:
    # The reference deployment serves vLLM 0.20.2rc1 from a venv on SLURM;
    # v0.20.2 is the nearest release image.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.20.2}
    container_name: ${MUNIN_PREFIX:-munin}-vllm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VLLM_HOST_PORT:-8000}:8000"
    volumes:
      # Weights are large. Cache them outside the container so a recreate does
      # not re-download, and so a host-side vLLM can share the same cache.
      - ${MUNIN_ROOT:-/opt/munin}/data/models:/models
      - ${HF_CACHE_DIR:-${MUNIN_ROOT:-/opt/munin}/data/hf-cache}:/root/.cache/huggingface
    command: >
      --model ${VLLM_SERVE_MODEL:-cyankiwi/Qwen3.8-27B-AWQ-INT4}
      --served-model-name ${LLM_MODEL_NAME:-${VLLM_MODEL_NAME:-qwen3.8-27b}}
      --host 0.0.0.0 --port 8000
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.90}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-65536}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-2}
      --kv-cache-dtype ${VLLM_KV_CACHE_DTYPE:-fp8}
      --enable-auto-tool-choice
      --tool-call-parser ${VLLM_TOOL_PARSER:-qwen3_xml}
      --reasoning-parser ${VLLM_REASONING_PARSER:-qwen3}
      ${VLLM_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    profiles:
      - gpu

  # ============================================================================
  # PAPER PIPELINE JOBS (profile: pipeline)
  # ============================================================================
  # Container equivalents of four host-side systemd units:
  #   munin-paper-pipeline.service     -> pipeline-watcher
  #   munin-paper-detect.service       -> pipeline-detect
  #   munin-paper-reattribute.timer    -> pipeline-reattribute
  #   munin-embedding-map.timer        -> knowledge-map
  #
  # >>> DO NOT ENABLE THIS PROFILE ON THE REFERENCE CLUSTER. <<<
  # The cluster runs the systemd units above. Starting these alongside them
  # gives you TWO watchers ingesting the same drop directory and two detect
  # sweeps quarantining concurrently, which saturates GROBID's engine pool
  # (the exact failure the watcher's --workers 1 exists to avoid). Pick one
  # mechanism per host. `deploy.sh` never passes --profile pipeline.
  #
  # The first three reuse the retrieval image rather than building their own:
  # every dependency they import (qdrant_client, neo4j, sentence_transformers,
  # torch, pypdf, yaml, requests) is already installed there, so a second image
  # would duplicate ~2.5 GB of torch for nothing. They therefore require the
  # `rag` profile to have built that image at least once -- which it will have,
  # since nothing here is useful without the retrieval service anyway.

  pipeline-watcher:
    image: ${MUNIN_PREFIX:-munin}-retrieval:latest
    container_name: ${MUNIN_PREFIX:-munin}-pipeline-watcher
    restart: unless-stopped
    # --workers 1 is deliberate and load-bearing: GROBID has a finite engine
    # pool (~10) and /api/admin/ingest consumes from the same pool. Raising it
    # reproduced "Could not get an engine from the pool" 503s in 2026-04.
    command: >
      python /app/scripts/pipeline/paper_pipeline.py
      --watch --fast --workers 1 --dir /papers
    volumes:
      - ${MUNIN_SCRIPTS_SRC:-/opt/cluster/scripts}:/app/scripts:ro
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/pdf:/papers:rw
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/processed:/papers-processed:rw
      - ${MUNIN_ROOT:-/opt/munin}/data:/data:rw
      - ${MUNIN_ROOT:-/opt/munin}/data/models/bge-large:/models/bge-large:ro
      # Hugging Face cache: when no weights were staged under data/models,
      # the encoders download once into here instead of on every recreate.
      - ${HF_CACHE_DIR:-${MUNIN_ROOT:-/opt/munin}/data/hf-cache}:/root/.cache/huggingface
      - ${MUNIN_ROOT:-/opt/munin}/data/models/specter:/models/specter:ro
    environment: &pipeline_env
      # Service names, not 127.0.0.1: the systemd units use loopback because
      # they run on the host and reach the published ports. In-network these
      # resolve directly and do not depend on the port publishing at all.
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      - GROBID_URL=http://grobid:8070
      # Encoder/collection pair. MUST match what retrieval serves or ingest
      # writes vectors the search path cannot read. Same pairing rule as
      # database.verify_paper_space(); see DECISIONS.md 2026-08.
      - PAPER_ENCODER=${PAPER_ENCODER:-bge-large}
      - PAPERS_COLLECTION=${PAPERS_COLLECTION:-papers_bge}
      - BGE_LARGE_MODEL_PATH=${BGE_LARGE_MODEL_PATH:-/models/bge-large}
      - SPECTER_MODEL_PATH=/models/specter
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CONTRIBUTORS_CONFIG_PATH=/data/contributors.yml
      - ADMIN_EMAIL=${PIPELINE_ADMIN_EMAIL:-${MUNIN_CONTACT_EMAIL:-}}
      - WATCH_POLL_SECS=${WATCH_POLL_SECS:-60}
    depends_on:
      - qdrant
      - neo4j
      - grobid
    profiles:
      - pipeline

  pipeline-detect:
    image: ${MUNIN_PREFIX:-munin}-retrieval:latest
    container_name: ${MUNIN_PREFIX:-munin}-pipeline-detect
    restart: unless-stopped
    # `sweep` is already an internally-paced infinite loop
    # (DETECT_CYCLE_PACE_SECS), so it maps to a long-running container
    # directly and needs no scheduler wrapper.
    command: python /app/scripts/pipeline/paper_cleanup.py sweep
    volumes:
      - ${MUNIN_SCRIPTS_SRC:-/opt/cluster/scripts}:/app/scripts:ro
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/pdf:/papers:rw
      - ${MUNIN_ROOT:-/opt/munin}/data:/data:rw
      - ${MUNIN_ROOT:-/opt/munin}/data/models/bge-large:/models/bge-large:ro
      # Hugging Face cache: when no weights were staged under data/models,
      # the encoders download once into here instead of on every recreate.
      - ${HF_CACHE_DIR:-${MUNIN_ROOT:-/opt/munin}/data/hf-cache}:/root/.cache/huggingface
      - ${MUNIN_ROOT:-/opt/munin}/data/models/specter:/models/specter:ro
    environment: *pipeline_env
    depends_on:
      - qdrant
      - neo4j
      - grobid
    profiles:
      - pipeline

  pipeline-reattribute:
    image: ${MUNIN_PREFIX:-munin}-retrieval:latest
    container_name: ${MUNIN_PREFIX:-munin}-pipeline-reattribute
    restart: unless-stopped
    command: >
      /app/scripts/run-daily.sh ${REATTRIBUTE_AT:-04:30}
      python /app/scripts/pipeline/paper_cleanup.py reattribute
    volumes:
      - ${MUNIN_SCRIPTS_SRC:-/opt/cluster/scripts}:/app/scripts:ro
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/pdf:/papers:rw
      - ${MUNIN_ROOT:-/opt/munin}/data:/data:rw
    environment: *pipeline_env
    depends_on:
      - qdrant
      - neo4j
    profiles:
      - pipeline

  # ============================================================================
  # SEED CORPUS (profile: seed) - one-shot
  # ============================================================================
  # A fresh instance has an empty corpus, which looks identical to a broken
  # one. This downloads open-access arXiv PDFs into the pipeline's drop
  # directory and exits; the watcher does the actual ingest, so this service
  # never touches Qdrant or Neo4j.
  #
  # Requires the `pipeline` profile too, or the PDFs will just sit there.
  # Re-running is free: already-present files are skipped.
  seed:
    image: ${MUNIN_PREFIX:-munin}-retrieval:latest
    container_name: ${MUNIN_PREFIX:-munin}-seed
    restart: "no"
    command: >
      python /app/scripts/seed/seed_corpus.py
      --limit ${SEED_LIMIT:-20}
      --dir /papers
    volumes:
      - ${MUNIN_SCRIPTS_SRC:-/opt/cluster/scripts}:/app/scripts:ro
      - ${MUNIN_ROOT:-/opt/munin}/data/papers/pdf:/papers:rw
    environment:
      # Seed your own field instead of the reference deployment's domain, e.g.
      #   SEED_QUERY='abs:"transformer" AND cat:cs.CL'
      - SEED_QUERY=${SEED_QUERY:-}
      # arXiv asks for 3s between requests. Do not lower it.
      - SEED_DELAY=${SEED_DELAY:-3}
    profiles:
      - seed

  # ============================================================================
  # KNOWLEDGE MAP (profile: pipeline)
  # ============================================================================
  knowledge-map:
    build:
      context: ${MUNIN_KNOWLEDGE_SRC:-/opt/cluster/scripts/knowledge}
      dockerfile: Dockerfile
    image: ${MUNIN_PREFIX:-munin}-knowledge:latest
    container_name: ${MUNIN_PREFIX:-munin}-knowledge-map
    restart: unless-stopped
    command: >
      /app/scripts/run-daily.sh ${EMBEDDING_MAP_AT:-01:30}
      python /app/scripts/knowledge/build_embedding_map.py
    volumes:
      - ${MUNIN_SCRIPTS_SRC:-/opt/cluster/scripts}:/app/scripts:ro
      - ${MUNIN_ROOT:-/opt/munin}/knowledge:/knowledge:rw
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # The collection the map is built FROM. Must track PAPERS_COLLECTION:
      # pointing it at the retired `papers` silently maps the wrong corpus.
      # The repo's systemd unit carried the stale `papers` default until
      # 2026-08-14, masked in production only by an untracked drop-in.
      - QDRANT_COLLECTION=${PAPERS_COLLECTION:-papers_bge}
      - VLLM_URL=${LLM_BASE_URL:-${VLLM_URL:-http://host.docker.internal:8000}}
      - VLLM_MODEL_NAME=${LLM_MODEL_NAME:-${VLLM_MODEL_NAME:-qwen3.8-27b}}
      - LLM_THINKING_MODE=${LLM_THINKING_MODE:-enable_thinking}
      - EMBEDDING_MAP_PATH=/knowledge/embedding_map.json
      # Persist the numba JIT cache so the UMAP compile is paid once.
      - NUMBA_CACHE_DIR=/knowledge/numba-cache
      # A fresh instance has no map at all, so build one immediately rather
      # than leaving the knowledge page empty until the first 01:30.
      - RUN_DAILY_ON_START=${EMBEDDING_MAP_ON_START:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    profiles:
      - pipeline

  # ============================================================================
  # PROMETHEUS - scrape /metrics from retrieval (P1 #12)
  # ============================================================================
  # Bound to 127.0.0.1:9090 only. Same network as retrieval so it can
  # reach it by service name. Lives under the `monitoring` profile so a
  # cluster boot that doesn't want metrics can skip it. There is no
  # Grafana service: the dashboards live in-tree under the webui
  # admin panel and query Prometheus via a retrieval-side proxy at
  # /api/admin/metrics/{query,query_range} -- see docs/MONITORING.md.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ${MUNIN_PREFIX:-munin}-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ${MUNIN_DOCKER_CONFIG:-/opt/munin/docker}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - default
    profiles:
      - monitoring

  # ── Reverse SSH tunnel to the frontend (profile: tunnel) ──────────────────
  # Dials the VPS and exposes retrieval there as 127.0.0.1:18080, the
  # frontend's default BACKEND_URL, so nothing has to connect IN to this
  # host. For hosts where installing a systemd unit is not an option; the
  # reference deployment runs the same autossh as munin-tunnel.service.
  #
  # Needs, on this host: a key at MUNIN_TUNNEL_KEY (mode 600; its .pub goes in
  # the VPS tunnel user's authorized_keys, restricted to port forwarding), and
  # MUNIN_VPS_HOST. The VPS host key is pinned on first connect into the
  # tunnel directory (accept-new, like the systemd unit).
  tunnel:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20.10
        RUN apk add --no-cache autossh openssh-client
    image: ${MUNIN_PREFIX:-munin}-tunnel:latest
    container_name: ${MUNIN_PREFIX:-munin}-tunnel
    restart: unless-stopped
    environment:
      - AUTOSSH_GATETIME=0
      - AUTOSSH_POLL=30
      - MUNIN_VPS_HOST=${MUNIN_VPS_HOST:-}
      - MUNIN_TUNNEL_USER=${MUNIN_TUNNEL_USER:-tunnel}
    volumes:
      - ${MUNIN_TUNNEL_KEY:-${MUNIN_ROOT:-/opt/munin}/config/tunnel/id_ed25519}:/tunnel/key:ro
      - ${MUNIN_ROOT:-/opt/munin}/config/tunnel:/tunnel/state
    # Compose cannot require these only for one profile, so check at start.
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$MUNIN_VPS_HOST" ] || { echo "tunnel: set MUNIN_VPS_HOST"; exit 1; }
        [ -s /tunnel/key ] || { echo "tunnel: no key at MUNIN_TUNNEL_KEY"; exit 1; }
        exec autossh -M 0 -N \
          -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
          -o ExitOnForwardFailure=yes \
          -o StrictHostKeyChecking=accept-new \
          -o UserKnownHostsFile=/tunnel/state/known_hosts \
          -i /tunnel/key \
          -R 127.0.0.1:18080:retrieval:8080 \
          "$$MUNIN_TUNNEL_USER@$$MUNIN_VPS_HOST"
    # No depends_on: retrieval sits in the `rag` profile, and a dependency on
    # a profiled service breaks a backend that runs this profile alone. The
    # VPS end only connects to retrieval per request, and autossh retries.
    networks:
      - default
    profiles:
      - tunnel

volumes:
  prometheus_data:
    # Pinned explicitly. Compose would otherwise derive it from the project
    # name, so any future change to `name:` above would silently orphan the
    # TSDB and Prometheus would restart with no history.
    name: ${MUNIN_PREFIX:-munin}_prometheus_data

networks:
  default:
    name: ${MUNIN_PREFIX:-munin}-network
  sandbox-net:
    name: ${MUNIN_PREFIX:-munin}-sandbox-net
    # internal: true means containers on this network have no route to the
    # outside world. Combined with firejail --net=none on the kernel
    # subprocess itself, the kernel ends up doubly isolated: the kernel
    # process has only loopback in its own namespace, and the container
    # hosting the sandbox-svc parent has no public IP either.
    internal: true
