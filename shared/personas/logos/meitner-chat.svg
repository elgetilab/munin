<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#111111"/>

  <!-- Parent nucleus -->
  <circle cx="100" cy="60" r="22" fill="none" stroke="white" stroke-width="6"/>

  <!-- Fission crack through it -->
  <polyline points="100,38 95,50 105,60 95,70 100,82" fill="none" stroke="#111111" stroke-width="7"/>
  <polyline points="100,38 95,50 105,60 95,70 100,82" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Split lines going to daughters -->
  <line x1="93" y1="80" x2="72" y2="112" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="107" y1="80" x2="128" y2="112" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left daughter nucleus -->
  <circle cx="62" cy="140" r="15" fill="none" stroke="white" stroke-width="6"/>

  <!-- Right daughter nucleus -->
  <circle cx="138" cy="140" r="15" fill="none" stroke="white" stroke-width="6"/>

  <!-- Free neutrons -->
  <circle cx="40" cy="108" r="4.5" fill="white"/>
  <circle cx="160" cy="108" r="4.5" fill="white"/>
  <circle cx="100" cy="168" r="4.5" fill="white"/>
</svg>
