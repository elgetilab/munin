# Grafana provisioning: dashboard providers.
#
# Tells Grafana where to find dashboard JSON files. We mount the
# repo's grafana/dashboards/ dir read-only and let Grafana reload it
# every 30s so a `git pull` on the host updates the live dashboards
# without restarting the container.

apiVersion: 1

providers:
  - name: munin
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
