services:
  # ── Caddy — reverse proxy + SSL ────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── munin-auth — email OTP authentication ─────────────────────────────────
  munin-auth:
    build: ./auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./auth/whitelist.csv:/data/whitelist.csv:ro
      # P1 #11 one-shot seed: contributors.yml is imported into the
      # users table on first boot, then served from the DB. The file
      # itself is no longer consulted at request time.
      - ../shared/config/contributors.yml:/data/contributors.yml:ro
      - auth_data:/data/db
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER: ${SMTP_SENDER:-noreply@muninai.org}
      SESSION_MAX_AGE: 2592000
      OTP_EXPIRY: 600
      # P1 #11: bearer token the cluster uses to fetch
      # /admin/contributors.yaml without needing an admin session.
      CONTRIBUTORS_SYNC_TOKEN: ${CONTRIBUTORS_SYNC_TOKEN:-}

  # ── tusd — chunked file upload server ──────────────────────────────────────
  tusd:
    image: tusproject/tusd:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/uploads/staging:/srv/tusd-data
    command: >
      -upload-dir=/srv/tusd-data
      -hooks-http=http://127.0.0.1:18088/hooks
      -hooks-http-forward-headers=X-Munin-Email,X-Munin-Name
      -port=11080
      -host=127.0.0.1
      -max-size=10737418240
      -behind-proxy
    depends_on:
      - hook-service

  # ── Hook Service — post-upload file organization + cluster ingest ──────────
  hook-service:
    build: ./upload
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/uploads:/mnt/uploads
    environment:
      ADMIN_INGEST_TOKEN: ${ADMIN_INGEST_TOKEN:-}
      CLUSTER_INGEST_URL: http://127.0.0.1:18080/api/admin/ingest

  # ── API Gateway — proxy, API keys, rate limiting, usage tracking ──────────
  api-gateway:
    build: ./gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - gateway_data:/data
      - ./config/quotas.yml:/data/quotas.yml:ro
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY}
      CLUSTER_TUNNEL: http://127.0.0.1:18080
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@muninai.org}

volumes:
  caddy_data:
  caddy_config:
  auth_data:
  gateway_data:
