name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The single-host smoke job is expensive (it builds the ~8.7 GB retrieval
  # image), so it does not run per-PR. Weekly plus on-demand is enough to catch
  # the quick-start rotting, which is the failure it exists to prevent.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: webui (lint, unit, build, e2e) [${{ matrix.os }}]
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19. 24.04 is the
    # supported image; 26.04 runs alongside as an early warning and may fail
    # without failing the run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    defaults:
      run:
        working-directory: frontend/webui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches frontend/webui/Dockerfile (node:22-alpine), which is what
          # the webui compose profile actually builds with. Node 20 went EOL
          # in April 2026, so CI was validating on a runtime nothing ships on.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/webui/package-lock.json
      - run: npm ci
      - name: Lint (app source, non-blocking pre-existing debt)
        run: npx eslint src
        continue-on-error: true
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright, mocked)
        run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: frontend/webui/playwright-report/
          retention-days: 7

  python:
    name: python services (pytest) [${{ matrix.os }}]
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19. 24.04 is the
    # supported image; 26.04 runs alongside as an early warning and may fail
    # without failing the run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: auth service tests
        run: |
          python -m pip install -U pip
          pip install -r frontend/auth/requirements-dev.txt -c frontend/auth/constraints.txt
          pytest frontend/auth/tests -q
      - name: upload service tests
        run: |
          pip install -r frontend/upload/requirements.txt -c frontend/upload/constraints.txt pytest pyyaml
          pytest frontend/upload/tests -q
      - name: benchmarks unit tests (pure functions)
        run: |
          pip install -r backend/benchmarks/requirements-ci.txt
          pytest backend/benchmarks/tests -q

  compose:
    name: compose invariants (single-host + cluster) [${{ matrix.os }}]
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19. 24.04 is the
    # supported image; 26.04 runs alongside as an early warning and may fail
    # without failing the run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: Compose config resolves, and the invariants hold
        # Cheap (no images pulled) and guards the properties the whole
        # single-host setup rests on: cluster defaults stay production, local
        # overrides reach the working tree, the project name is pinned so a
        # clone cannot adopt a running deployment, and frontend paths survive
        # being second in COMPOSE_FILE.
        run: python3 backend/scripts/ci/check_compose.py

      - name: Stub LLM behaves as an OpenAI-compatible endpoint
        run: |
          python3 backend/scripts/ci/stub_llm.py --port 18999 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18999/v1/models >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18999/v1/models >/dev/null
          curl -sf -X POST http://127.0.0.1:18999/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"m","messages":[]}' >/dev/null

      - name: Strict endpoint rejects the vLLM-only field (gates LLM_THINKING_TOGGLE)
        # Proves the toggle is load-bearing rather than decorative: with the
        # field present a strict server 400s, without it the same call succeeds.
        run: |
          python3 backend/scripts/ci/stub_llm.py --port 18998 --strict &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:18998/v1/models >/dev/null && break
            sleep 0.5
          done
          on=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18998/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model":"m","messages":[],"chat_template_kwargs":{"enable_thinking":false}}')
          off=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18998/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model":"m","messages":[]}')
          echo "toggle on -> $on, toggle off -> $off"
          test "$on" = "400" || { echo "expected 400 with the field"; exit 1; }
          test "$off" = "200" || { echo "expected 200 without it"; exit 1; }

      - name: A hosted endpoint gets its key (LLM_API_KEY), and only then answers
        run: |
          python3 backend/scripts/ci/stub_llm.py --port 18997 --api-key ci-key --model m &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:18997/v1/models && break
            sleep 0.5
          done
          pip install -q httpx
          cd backend/retrieval
          for key in "" ci-key; do
            LLM_BASE_URL=http://127.0.0.1:18997 LLM_MODEL_NAME=m LLM_API_KEY=$key \
              python3 -c "import httpx, sys; sys.path.insert(0, '.')
          from database import LLM_HEADERS, VLLM_URL
          r = httpx.post(VLLM_URL + '/v1/chat/completions', headers=LLM_HEADERS,
                         json={'model': 'm', 'messages': []})
          print('key=[$key] ->', r.status_code)
          assert r.status_code == (200 if '$key' else 401)"
          done

  single-host-smoke:
    name: single-host smoke (one machine, both halves, against a stub LLM) [${{ matrix.os }}]
    # Not on PRs: builds the ~10 GB retrieval image. Weekly + on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Pinned: ubuntu-latest moves to 26.04 on 2026-10-19. 24.04 is the
    # supported image; 26.04 runs alongside as an early warning and may fail
    # without failing the run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        # The retrieval image alone is larger than the free space a stock
        # runner leaves, so drop the preinstalled toolchains we do not use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Configure for a single host (scripts/configure.sh, as a user would)
        run: |
          # No GPU and no model on a CI runner: point at the stub on the host.
          # Port 8001, NOT the compose default 8000: on the default port this
          # job passed even while LLM_BASE_URL never reached the container.
          scripts/configure.sh --non-interactive --mode all --domain localhost \
            --admin-email ci@example.org \
            --llm-url http://host.docker.internal:8001 --llm-model stub
          # Both compose files, as the one-machine install runs them; only the
          # rag profile, to stay inside the runner's disk. The other profiles
          # and modes are resolved by the compose job, not booted here.
          sed -i 's|^COMPOSE_PROFILES=.*|COMPOSE_PROFILES=rag|' .env

      - name: Start the stub LLM
        run: |
          nohup python3 backend/scripts/ci/stub_llm.py --port 8001 --model stub \
            > /tmp/stub-llm.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8001/v1/models >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8001/v1/models

      - name: Bring the stack up (retrieval and its databases, plus the frontend's caddy, auth and gateway)
        run: docker compose up -d --build qdrant neo4j grobid retrieval caddy munin-auth api-gateway

      - name: Retrieval becomes healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8080/health

      - name: It reached the model endpoint
        run: |
          status=$(curl -sf http://127.0.0.1:8080/api/status)
          echo "$status" | python3 -m json.tool
          echo "$status" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['vllm']['status'] == 'running', d['vllm']
          assert d['services']['retrieval'] == 'ok', d['services']
          print('status ok')"

      - name: A real LLM round-trip through the tool path
        # Exercises the code that builds the request body, including the
        # thinking toggle, rather than only asserting the service booted.
        run: |
          docker compose exec -T retrieval python -c "
          import asyncio, sys
          sys.path.insert(0, '/app')
          from mcp.tools.llm import llm_summarize
          r = asyncio.run(llm_summarize('Some text to condense.', 'Summarise.'))
          assert 'error' not in r, r
          print('llm_summarize ok:', str(r)[:100])"

      - name: The encoders load on a fresh install (no weights staged)
        # The model directories are empty bind mounts here, as on any fresh
        # install. Until 2026-10-05 an empty directory counted as a model and
        # nothing fell back to Hugging Face, so no encoder ever loaded.
        run: |
          docker compose exec -T retrieval python -c "
          import sys; sys.path.insert(0, '/app')
          import database
          assert len(database.encode_paper_query('membrane proteins')) == 1024
          assert database.get_bge() is not None
          print('paper encoder and document encoder load')"
          curl -sf http://127.0.0.1:8080/api/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['services']['embedding'] == 'ok', d['services']
          print('status: embedding ok')"

      - name: GROBID and the API gateway both run (they used to fight over port 8070)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8071/api/isalive >/dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8071/api/isalive
          test "$(docker compose ps --format '{{.Service}} {{.State}}' api-gateway)" = "api-gateway running"

      - name: Log in through Caddy and reach retrieval through the gateway
        # The whole browser path: Caddy, munin-auth (code echoed to its log
        # on localhost), the session cookie, forward-auth, the gateway, and
        # retrieval behind it.
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost/login && break
            sleep 2
          done
          curl -sf -o /dev/null -X POST http://localhost/login -d email=ci@example.org
          code=$(docker compose logs munin-auth 2>&1 \
                 | grep -o 'login code for ci@example.org is [0-9]*' | tail -n1 | awk '{print $NF}')
          test -n "$code" || { echo "no login code in the auth log"; exit 1; }
          # The session cookie is Secure. Browsers send it to http://localhost,
          # curl does not, so carry it by hand.
          cookie=$(curl -s -o /dev/null -D - -X POST http://localhost/verify \
                   -d email=ci@example.org -d code=$code \
                   | grep -io 'munin_session=[^;]*' | head -n1)
          test -n "$cookie" || { echo "verify did not set a session cookie"; exit 1; }
          curl -sf -H "Cookie: $cookie" http://localhost/auth/me | python3 -m json.tool
          curl -sf -H "Cookie: $cookie" http://localhost/api/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['services']['retrieval'] == 'ok', d
          print('logged in; /api/status through caddy and the gateway: ok')"

      - name: Logs on failure
        if: failure()
        run: |
          echo '--- stub ---'; cat /tmp/stub-llm.log || true
          for s in retrieval munin-auth api-gateway caddy grobid; do
            echo "--- $s ---"; docker compose logs --tail 100 $s || true
          done

      - name: Tear down
        if: always()
        run: docker compose down -v || true

# Note: the retrieval service unit tests (backend/retrieval/tests) need heavy
# deps (torch, qdrant-client) + a running vLLM/Qdrant/Neo4j for some, so they run
# on the cluster, not in CI. The `single-host-smoke` job above now boots that
# image against a stub, which covers the import/startup path; the tests
# themselves still run on the cluster. The behavioral evals (evals/run_eval.py,
# munin_bench) are live-service and stay out of CI.
