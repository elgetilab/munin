<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="white"/>

  <!-- Tape: 5 cells across centre -->
  <!-- Cell width 32, gap 0, total 160, starts at x=20 -->
  <!-- Row y=82, height=36 -->

  <!-- Tape cells outline -->
  <rect x="20"  y="82" width="32" height="36" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="52"  y="82" width="32" height="36" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="84"  y="82" width="32" height="36" fill="#111111"/>
  <rect x="116" y="82" width="32" height="36" fill="none" stroke="#111111" stroke-width="3"/>
  <rect x="148" y="82" width="32" height="36" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- Symbols on tape cells -->
  <!-- Cell 1: 0 -->
  <text x="36" y="107" text-anchor="middle" font-family="monospace" font-size="16" fill="#111111">0</text>
  <!-- Cell 2: 1 -->
  <text x="68" y="107" text-anchor="middle" font-family="monospace" font-size="16" fill="#111111">1</text>
  <!-- Cell 3 (active, white fill): 1 in black -->
  <text x="100" y="107" text-anchor="middle" font-family="monospace" font-size="16" fill="white" font-weight="bold">1</text>
  <!-- Cell 4: 0 -->
  <text x="132" y="107" text-anchor="middle" font-family="monospace" font-size="16" fill="#111111">0</text>
  <!-- Cell 5: blank -->
  <text x="164" y="107" text-anchor="middle" font-family="monospace" font-size="16" fill="#111111">_</text>

  <!-- Read/write head: triangle pointing down from above -->
  <polygon points="100,52 88,76 112,76" fill="#111111"/>

  <!-- Head stem -->
  <line x1="100" y1="118" x2="100" y2="148" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <!-- State box -->
  <rect x="76" y="148" width="48" height="28" rx="4" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="100" y="167" text-anchor="middle" font-family="monospace" font-size="13" fill="#111111">q₁</text>
</svg>
